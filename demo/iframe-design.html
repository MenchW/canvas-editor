<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宿主系统集成 Canvas Editor SDK 演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
    }
    .parent-header {
      height: 54px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
      position: relative;
    }
    .parent-header .left-panel {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .parent-header .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .parent-header .badge {
      font-size: 11px;
      background: #059669;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .parent-header .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      border: none;
      outline: none;
      padding: 7px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-success {
      background: #059669;
      color: #ffffff;
    }
    .btn-success:hover {
      background: #047857;
    }
    .status-tips {
      font-size: 12px;
      color: #38bdf8;
      margin-left: 8px;
    }
    .iframe-container {
      width: 100%;
      height: calc(100% - 54px);
      position: relative;
    }
    .editor-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 模拟宿主业务系统 Header -->
  <div class="parent-header">
    <div class="left-panel">
      <div class="title">宿主业务系统 - 报告设计器</div>
      <div class="badge">SDK 集成模式</div>
      <span class="status-tips" id="status-tips">状态：等待 iframe 子窗口 Ready...</span>
    </div>

    <div class="actions">
      <button class="btn btn-success" id="btn-fill-data">
        🚀 填充占位符数据 (setControlValueList)
      </button>
      <button class="btn btn-success" id="btn-get-control-list">
        🔍 获取控件列表 (getControlList)
      </button>
      <button class="btn btn-success" id="btn-check-missing">
        ⚖️ 检查未对齐控件 (getMissingControlList)
      </button>
      <button class="btn btn-success" id="btn-get-value">
        📄 获取当前文档 JSON 数据 (getValue)
      </button>
    </div>
  </div>

  <!-- iframe 编辑器载入容器 -->
  <div class="iframe-container">
    <iframe
      id="canvas-editor-iframe"
      class="editor-iframe"
      src="../index.html"
      allowfullscreen="true"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-forms allow-downloads"
    ></iframe>
  </div>

  <!-- 公共 API 与 Mock 数据 -->
  <script src="./common/api.js"></script>
  <script src="./common/mock.js"></script>

  <!-- 宿主系统引入 4KB 独立打包产物 SDK -->
  <script type="module">
    import { EditorClient } from '../src/sdk';

    const statusEl = document.getElementById('status-tips');
    const btnGetValue = document.getElementById('btn-get-value');
    const btnFillData = document.getElementById('btn-fill-data');
    const btnGetControlList = document.getElementById('btn-get-control-list');
    const btnCheckMissing = document.getElementById('btn-check-missing');

    const updateStatus = (text) => {
      if (statusEl) {
        statusEl.textContent = `状态: ${text}`;
      }
    };

    // -------------------------------------------------------------
    // 【宿主接入】实例化 EditorClient SDK
    // -------------------------------------------------------------
    const editorClient = new EditorClient({
      iframe: '#canvas-editor-iframe',
      appId: 'c377fb213ad9703',

      config: {
        mode: 'edit',
        features: {
          save: true,
          asidePanel: true,
          modeSwitch: true,
          comment: true,
          signature: true,
          macro: false,
          export: true
        }
      },

      // 数据 Providers
      // getData: async () => await window.mockFetchBusinessDataApi(),
      getTemplate: async () => await window.mockFetchTemplateApi(),
      getComponents: async () => await window.mockFetchComponentListApi(),

      // 保存 Hook
      onSave: async (documentJson, toast) => {
        console.log('[宿主系统] 收到 Editor 提交保存 JSON:', documentJson);
        const savePayload = documentJson.savePayload || {
          appId: 'c377fb213ad9703',
          reportData: JSON.stringify(documentJson)
        };
        const closeLoading = toast.loading('文档保存中...');
        try {
          console.log('[宿主系统] 开始请求后端保存接口...', savePayload);
          // 使用统一 API 客户端（已内置 Content-Type: application/json、Token 及状态码校验）
          await window.apiRequest('/system/report-template', {
            method: 'POST',
            data: savePayload
          });
          updateStatus('已成功保存文档及模板数据');
          toast.success('保存成功');
        } catch (err) {
          console.error('[宿主系统] 保存异常:', err);
          updateStatus(`保存失败：${err.message || '网络或服务异常'}`);
          toast.error(err.message || '保存失败');
        } finally {
          closeLoading();
        }
      },

      // 打印 Hook
      onPrint: async (e) => {
        console.log('[宿主系统] 收到 Editor 打印 Hook 通知');
        alert('拦截打印')
        return false
      },

      // 图片/签名上传 Hook
      onUploadImage: async (base64) => {
        console.log('[宿主系统] 收到上传 Base64 请求，正在模拟上传至 OSS...');
        return base64;
      }
    });

    // 绑定演示操作按钮
    btnFillData?.addEventListener('click', async () => {
      const data = await window.mockFetchBusinessDataApi();
      await editorClient.setControlValueList(data);
      updateStatus('已成功填充占位符数据');
    });

    btnGetControlList?.addEventListener('click', async () => {
      const list = await editorClient.getControlList();
      console.log('[宿主] 当前控件列表:', list);
    });

    btnCheckMissing?.addEventListener('click', async () => {
      const auditResult = await editorClient.getMissingControlList();
      console.log('[宿主] 控件数据审计结果:', auditResult);
    });

    btnGetValue?.addEventListener('click', async () => {
      const doc = await editorClient.getValue();
      console.log('[宿主] 当前文档 JSON:', doc);
    });
  </script>
</body>
</html>
