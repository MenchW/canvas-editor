<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宿主系统集成 Canvas Editor SDK 演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
    }
    .parent-header {
      height: 54px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
      position: relative;
    }
    .parent-header .left-panel {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .parent-header .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .parent-header .badge {
      font-size: 11px;
      background: #059669;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .parent-header .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      border: none;
      outline: none;
      padding: 7px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-success {
      background: #059669;
      color: #ffffff;
    }
    .btn-success:hover {
      background: #047857;
    }
    .status-tips {
      font-size: 12px;
      color: #38bdf8;
      margin-left: 8px;
    }
    .iframe-container {
      width: 100%;
      height: calc(100% - 54px);
      position: relative;
    }
    .editor-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 模拟宿主业务系统 Header -->
  <div class="parent-header">
    <div class="left-panel">
      <div class="title">宿主业务系统 - 报告设计器</div>
      <div class="badge">SDK 集成模式</div>
      <span class="status-tips" id="status-tips">状态：等待 iframe 子窗口 Ready...</span>
    </div>

    <div class="actions">
      <button class="btn btn-success" id="btn-fill-data">
        🚀 填充占位符数据 (setControlValueList)
      </button>
      <button class="btn btn-success" id="btn-get-control-list">
        🔍 获取控件列表 (getControlList)
      </button>
      <button class="btn btn-success" id="btn-get-value">
        📄 获取当前文档 JSON 数据 (getValue)
      </button>
    </div>
  </div>

  <!-- iframe 编辑器载入容器 -->
  <div class="iframe-container">
    <iframe
      id="canvas-editor-iframe"
      class="editor-iframe"
      src="../index.html"
      allowfullscreen="true"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-forms allow-downloads"
    ></iframe>
  </div>

  <!-- 宿主系统引入 4KB 独立打包产物 SDK -->

    // -------------------------------------------------------------

      config: {
        mode: 'edit',
        features: {
          save: true,
          modeSwitch: true,
          comment: true,
          signature: true,
          macro: false,
          export: true

      // getTemplate: async () => await mockFetchTemplateApi(),

        console.log('[宿主系统] 收到 Editor 提交保存 JSON:', documentJson);
      },

      // 打印 Hook
      onPrint: async (e) => {
        console.log('[宿主系统] 收到 Editor 打印 Hook 通知');

      onUploadImage: async (base64) => {

    // -------------------------------------------------------------
    // 组件字典 Provider：优先读取本地缓存，未设置时回退至 DEFAULT_COMPONENT_DATA 下发
    // -------------------------------------------------------------
    function mockFetchComponentListApi() {
      const savedDict = localStorage.getItem('CE_COMPONENT_DICTIONARY');
      if (savedDict) {
        try {
          const parsed = JSON.parse(savedDict);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return Promise.resolve(parsed);
          }
        } catch (e) {
          console.warn('[mockFetchComponentListApi] 读取本地字典解析异常', e);
        }
      }

      return Promise.resolve(DEFAULT_COMPONENT_DATA);
    }
