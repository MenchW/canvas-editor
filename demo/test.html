  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
    }
    .parent-header {
      height: 54px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
      position: relative;
    }
    .parent-header .left-panel {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .parent-header .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .parent-header .title span.badge {
      font-size: 11px;
      background: #3b82f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .parent-header .status {
      font-size: 12px;
      color: #94a3b8;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      height: 32px;
      padding: 0 12px;
      font-size: 13px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #475569;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }
    .main-container {
      width: 100%;
      height: calc(100% - 54px);
      display: flex;
      position: relative;
    }
    iframe#canvas-editor-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
  <script src="./common/mock.js"></script>
</head>

  <header class="parent-header">
    <div class="left-panel">
      <div class="title">
        <span>宿主集成平台</span>
        <span class="badge">本地纯净版</span>
      </div>
      <div id="status-text" class="status">系统准备就绪 (纯本地 Mock 模式)</div>
    </div>
    <div class="actions">
      <button id="btn-fill-data" class="btn btn-primary">
        <span>📥</span> 填充业务数据
      </button>
      <button id="btn-get-control-list" class="btn">
        <span>📋</span> 控件列表
      </button>
      <button id="btn-check-missing" class="btn">
        <span>🔍</span> 数据完整性审计
      </button>
      <button id="btn-get-value" class="btn">
        <span>📄</span> 导出文档 JSON
      </button>
    </div>
  </header>

  <main class="main-container">
    <iframe
      id="canvas-editor-iframe"
      src="../index.html"
      allow="clipboard-read; clipboard-write"
